[package]
name = "git-control"
version = "0.1.0"
description = "Blazing-fast, glassmorphic desktop Git GUI & interactive angular commit graph built with Tauri v2, React 18, and Monaco Editor"
authors = ["Diki & Git Control Contributors"]
license = "MIT"
edition = "2021"
keywords = ["git", "git-gui", "git-graph", "tauri", "developer-tools"]
categories = ["development-tools", "gui"]

[lib]
name = "git_control_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
window-vibrancy = "0.5"
rfd = "0.14"
notify = "6.1"
keyring = "4.2.0"

[profile.release]
opt-level = "z"     # Optimize for smallest binary size
lto = true          # Link-Time Optimization across crates
codegen-units = 1   # Better inlining / dead-code elimination
panic = "abort"     # Drop stack-unwinding machinery
strip = true        # Strip debug symbols from release binary
