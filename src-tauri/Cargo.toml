[package]
name = "git-control"
version = "0.1.0"
description = "Multi-platform Git GUI with vscode-git-graph visualization and Native OS Glassmorphism"
authors = ["Git Control Team"]
edition = "2021"

[lib]
name = "git_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["macos-private-api"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
window-vibrancy = "0.5"
rfd = "0.14"
notify = "6.1"
